name: CI

on:
  push:
    branches: [ main, entrega-intermediaria ]
  pull_request:
    branches: [ main, entrega-intermediaria ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle
        run: mvn checkstyle:check

      - name: Testes
        run: mvn test