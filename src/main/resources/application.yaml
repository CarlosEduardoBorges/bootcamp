spring:
  application:
    name: financli

  datasource:
    url: jdbc:h2:file:./data/financli
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  main:
    banner-mode: off

logging:
  level:
    root: WARN
    org.springframework: WARN
    com.financli: INFO

cotacao:
  api:
    url: https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: cloud
  main:
    web-application-type: servlet